<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Studio Lite Indonesia</title>

    <link rel="icon" type="image/png" href="https://yt3.googleusercontent.com/yFpBRBmRpmoZdH3ji8t1o7lSGBCAMhi1yHF4kquKAQri7M7HFNXMrsJcGDegzZZ2lRF7nUsS=s160-c-k-c0x00ffffff-no-rj">

    <link rel="stylesheet" href="style.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/animate.css/4.1.1/animate.min.css"/>

    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.css">

    <link rel="stylesheet" type="text/css" href="https://cdn.jsdelivr.net/npm/toastify-js/src/toastify.min.css">

    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/sweetalert2@11/dist/sweetalert2.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.css">

    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/theme/monokai.min.css">
</head>

<body>

    <nav class="navbar">
        <div class="nav-content animate__animated animate__fadeInDown">

            <div class="nav-left">
                <button class="brand" onclick="navigate('')" style="background:none;border:none;padding:0;cursor:pointer">
                    <img src="https://yt3.googleusercontent.com/yFpBRBmRpmoZdH3ji8t1o7lSGBCAMhi1yHF4kquKAQri7M7HFNXMrsJcGDegzZZ2lRF7nUsS=s160-c-k-c0x00ffffff-no-rj" class="nav-icon" alt="Icon">

                    <span class="nav-title">
                        Studio Lite Indonesia
                    </span>
                </button>
            </div>

            <div class="nav-center">
                <div class="search-wrapper">

                    <svg class="search-icon" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <path d="m21 21-4.35-4.35"></path>
                    </svg>

                    <input
                        type="text"
                        id="search"
                        placeholder="Search..."
                        aria-label="Search scripts"
                    >

                </div>
            </div>

            <div class="nav-right"></div>

        </div>
    </nav>

    <div class="container">

        <div id="view-home" class="view-section animate__animated animate__fadeIn" style="display:block">

            <div class="content-wrapper">

                <aside class="sidebar">

                    <div class="sidebar-section">

                        <h3 class="sidebar-title">
                            Filters
                        </h3>

                        <div class="sidebar-links">

                            <a href="#"
                               class="sidebar-link active"
                               data-filter="all"
                               onclick="event.preventDefault(); app.filterCategory('all', event)">

                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
                                </svg>

                                All Scripts
                            </a>

                            <a href="#"
                               class="sidebar-link"
                               data-filter="public"
                               onclick="event.preventDefault(); app.filterCategory('public', event)">

                                <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <circle cx="12" cy="12" r="10"></circle>
                                    <path d="M2 12h20"></path>
                                </svg>

                                Public
                            </a>

                        </div>

                    </div>

                    <div class="sidebar-section sidebar-sort">

                        <h3 class="sidebar-title">
                            Sort By
                        </h3>

                        <select class="input-field select-sm" id="sort-select" onchange="app.setSort(this.value)">
                            <option value="newest">Newest First</option>
                            <option value="oldest">Oldest First</option>
                            <option value="alpha">A-Z</option>
                            <option value="updated">Recently Updated</option>
                        </select>

                    </div>

                </aside>

                <main class="main-content">

                    <div class="script-grid" id="script-list">

                        <div style="text-align:center;padding:60px 0;grid-column:1/-1">

                            <div class="spinner"></div>

                            <p>Loading library...</p>

                        </div>

                    </div>

                </main>

            </div>

        </div>

    </div>

    <footer class="footer">
    <div class="footer-content">

        <div class="footer-brand">
            <h3>Studio Lite Indonesia</h3>
            <p>Scripts, tools, and resources for Roblox developers.</p>
        </div>

        <div class="footer-links">
            <a href="#">Privacy Policy</a>
            <a href="#">Terms of Service</a>
            <a href="#">Community Rules</a>
            <a href="#">DMCA</a>
        </div>

        <div class="footer-socials">
    <a href="#" target="_blank" title="Roblox">
        <img src="https://cdn.simpleicons.org/roblox/white" alt="Roblox">
    </a>

    <a href="#" target="_blank" title="YouTube">
        <img src="https://cdn.simpleicons.org/youtube/white" alt="YouTube">
    </a>

    <a href="#" target="_blank" title="Instagram">
        <img src="https://cdn.simpleicons.org/instagram/white" alt="Instagram">
    </a>

    <a href="#" target="_blank" title="TikTok">
        <img src="https://cdn.simpleicons.org/tiktok/white" alt="TikTok">
    </a>
</div>

        <div class="footer-bottom">
            <p>© 2026 Studio Lite Indonesia. All rights reserved.</p>
        </div>

    </div>
    </footer>

    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <script type="text/javascript" src="https://cdn.jsdelivr.net/npm/toastify-js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/nprogress/0.2.0/nprogress.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/codemirror.min.js"></script>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/codemirror/5.65.13/mode/lua/lua.min.js"></script>

    <script src="app.js"></script>

    <script defer src='https://static.cloudflareinsights.com/beacon.min.js'
        data-cf-beacon='{"token": "468b54ebf85b4f809e3ba2eda2d74612"}'>
    </script>

</body>
</html>
