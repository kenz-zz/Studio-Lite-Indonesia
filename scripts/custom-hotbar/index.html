                    <button class="btn btn-sm icon-btn" onclick="downloadScript(this)" title="Download">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>

</button>

<button class="btn btn-sm icon-btn" onclick="copyScript(this)" title="Copy">
    <svg width="16" height="16" viewBox="0 0 24 24" fill="none"
    stroke="currentColor" stroke-width="2">
        <rect x="9" y="9" width="13" height="13" rx="2"/>
        <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/>
    </svg>
</button>
                    <a href="raw/custom-hotbar.lua" class="btn btn-secondary btn-sm" target="_blank">Raw</a>
                </div>
            </div>
            <pre><code id="code-display" class="language-lua">Loading...</code></pre>
        </div>
    </div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/prism.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/prism/1.29.0/components/prism-lua.min.js"></script>
    <script>
        const filename = 'custom-hotbar.lua';
        const scriptId = 'custom-hotbar';
        
        async function loadScript() {
            try {
                const res = await fetch(`raw/${filename}`);
                const code = await res.text();
                document.getElementById('code-display').textContent = code;
                Prism.highlightAll();
            } catch(e) {
                document.getElementById('code-display').textContent = '-- Error loading source';
            }
        }
        
        function copyScript(btn) {
    const code = document.getElementById('code-display').textContent;

    navigator.clipboard.writeText(code).then(() => {

        const original = btn.innerHTML;

        btn.innerHTML = 'Copied!';
        btn.style.width = 'auto';
        btn.style.padding = '0 14px';

        setTimeout(() => {
            btn.innerHTML = original;
            btn.style.width = '';
            btn.style.padding = '';
        }, 2000);

    });
        }
        
        function downloadScript(btn) {
    const original = btn.innerHTML;

    btn.innerHTML = 'Downloading!';
    btn.style.width = 'auto';
    btn.style.padding = '0 14px';

    const code = document.getElementById('code-display').textContent;
    const element = document.createElement('a');

    element.setAttribute(
        'href',
        'data:text/plain;charset=utf-8,' + encodeURIComponent(code)
    );
    element.setAttribute('download', filename);
    element.style.display = 'none';
    document.body.appendChild(element);
    element.click();
    document.body.removeChild(element);

    setTimeout(() => {
        btn.innerHTML = 'Downloaded!';

        setTimeout(() => {
            btn.innerHTML = original;
            btn.style.width = '';
            btn.style.padding = '';
        }, 1500);

    }, 500);
        }
        
        loadScript();
    </script>
